; CET Command Centre — OPcache freshness (staging web root).
;
; WHY THIS EXISTS: after a git deploy the LiteSpeed/lsphp workers can keep
; serving the PREVIOUS compiled bytecode out of OPcache. Because each worker
; has its own view of the cache, some requests ran new code and some ran old —
; which showed up as the driver link "sometimes right, sometimes wrong" (e.g.
; the child-seat line flipping between "3" and the old "* 3"). It was never a
; logic bug; it was stale, mixed compiled code.
;
; These directives are PHP_INI_ALL, so a per-directory .user.ini can set them.
; They make every worker re-check each file's timestamp on every request and
; recompile the moment the file changes on disk — so a `git reset --hard`
; deploy is picked up immediately by ALL workers. There is a tiny per-request
; stat cost; correctness on a driver's live job screen is worth far more.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
